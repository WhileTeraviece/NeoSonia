[workspace]
resolver = "2"
members = [
    "crates/neosonia-core",
    "crates/neosonia-tools",
    "crates/neosonia-mail",
    "crates/neosonia-web",
    "crates/neosonia-mcp",
    "crates/neosonia-app",
]

[patch.crates-io]
fenestra-core = { path = "vendor/fenestra-core" }
fenestra-shell = { path = "vendor/fenestra-shell" }

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
embed-resource = "2.5"
neosonia-core = { path = "crates/neosonia-core" }
neosonia-tools = { path = "crates/neosonia-tools" }
neosonia-mail = { path = "crates/neosonia-mail" }
neosonia-web = { path = "crates/neosonia-web" }
neosonia-mcp = { path = "crates/neosonia-mcp" }

# ---- LAN web server (remote devices) ----
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
qrcode = "0.14"
local-ip-address = "0.6"
urlencoding = "2"

# ---- desktop integration ----
rfd = "0.17"

# ---- GUI ----
fenestra = "0.41.0"
fenestra-markdown = "0.41.0"

# ---- async / http ----
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
async-trait = "0.1"
eventsource-stream = "0.2"

# ---- data / serde ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
percent-encoding = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
rand = "0.8"

# ---- storage ----
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
directories = "5"

# ---- fs ----
walkdir = "2"
globset = "0.4"
ignore = "0.4"
notify = "6"

# ---- system ----
sysinfo = "0.33"
open = "5"
arboard = "3"

# ---- windows automation (cross-platform where possible) ----
xcap = "0.0.14"
enigo = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
global-hotkey = "0.6"
tray-icon = "0.19"
raw-window-handle = "0.6"

# ---- web ----
scraper = "0.21"
html2text = "0.12"
encoding_rs = "0.8"
tungstenite = "0.24"

# ---- mail ----
imap = { version = "2.4", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "pool"] }
mail-parser = "0.9"

# ---- logging ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[profile.dev]
# 开发迭代优先：不优化，编译快（8 线程老 CPU，全量依赖 codegen 很贵）。
opt-level = 0
debug = 1
incremental = true

[profile.release]
# Release 构建：体积/性能平衡（8 核老 CPU，fat LTO 会让打包多花 ~10 分钟）。
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
debug = false
